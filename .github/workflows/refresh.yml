name: refresh

# Refresh the bronze→silver→gold→export pipeline and commit refreshed artifacts.
#
# Security notes:
#   - permissions is scoped to contents:write only (needed to push artifacts back).
#   - Third-party actions below are referenced by major version tag. Before
#     publishing this repo widely, run `gh dependabot` or pin to specific SHAs.
#   - GITHUB_TOKEN is the only credential used; no upstream source needs auth.

on:
  workflow_dispatch:
    inputs:
      snapshot-date:
        description: "Override snapshot date (YYYY-MM-DD). Default: today UTC."
        required: false
  schedule:
    # Monthly on the 5th at 04:00 UTC — late enough that monthly upstream
    # publications are usually out.
    - cron: "0 4 5 * *"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve snapshot date
        id: snapshot
        run: |
          if [ -n "${{ github.event.inputs.snapshot-date }}" ]; then
            echo "date=${{ github.event.inputs.snapshot-date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          SNAPSHOT_DATE: ${{ steps.snapshot.outputs.date }}
        run: make all SNAPSHOT_DATE="$SNAPSHOT_DATE"

      - name: Upload exports as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: transplant-atlas-exports-${{ steps.snapshot.outputs.date }}
          path: |
            data/exports/*.json
            data/exports/*.topojson
            schemas/*.schema.json
          if-no-files-found: error

      - name: Commit refreshed artifacts (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exports/ schemas/ data/raw/**/meta.json
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh snapshot ${{ steps.snapshot.outputs.date }}"
          git push
