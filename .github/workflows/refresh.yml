name: refresh

# TEMPORARY probe branch: checks whether datos.gob.mx answers GitHub-hosted runners.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          set +e
          curl -sS https://ipinfo.io/json; echo
          for ua in "transplant-atlas/0.1 (+https://github.com/enriqew/transplant-atlas)" \
                    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"; do
            for url in "https://www.datos.gob.mx/api/3/action/package_show?id=trasplantes_organos_tejidos" \
                       "https://www.datos.gob.mx/" \
                       "https://repodatos.atdt.gob.mx/api_update/cenatra/trasplantes_organos_tejidos/trasplantes_4toTrimestre2025.csv"; do
              echo "== UA=[$ua] $url"
              curl -sS -D - -o body.txt -A "$ua" --max-time 30 "$url" | head -20
              head -c 300 body.txt; echo; echo
            done
          done
